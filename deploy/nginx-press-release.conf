# Nginx の設定（HTTP・IP アドレスで公開するデモ用）。
# 置き場所：/etc/nginx/sites-available/press-release → sites-enabled にリンクする。
#
# 守り：
#  - 合言葉（Basic 認証）：発表の相手だけが見られる（/stripe/webhook だけは、Stripe が呼べるよう、対象外。
#    こちらは、アプリが、署名を確認して守る）
#  - 相手の IP を、X-Forwarded-For に、上書きして渡す（回数制限が、正しい IP で数えるため）。
#    相手が付けてきた X-Forwarded-For を、そのまま引き継がない
#  - 大きなファイル（記事の納品：最大10MB）を受けられる大きさ

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;                 # Nginx のバージョンを、出さない
    client_max_body_size 12m;          # 記事の納品ファイル（10MB）＋フォームの分
    client_body_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # 合言葉。ユーザー名とパスワードは、htpasswd で作る（手順書を参照）
    auth_basic "Demo (password required)";
    auth_basic_user_file /etc/nginx/press-release.htpasswd;

    # 証明書の取得（Let's Encrypt）の確認。合言葉の対象外（HTTPS にするときだけ使う）
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    # 隠しファイル（.git など）は、見せない
    location ~ /\.(?!well-known) { deny all; }

    # 見た目のファイル（CSS・ロゴ）は、Nginx から直接返す（速い）
    location /static/ {
        alias /opt/press-release/app/static/;
        expires 7d;
        access_log off;
    }

    # Stripe からの通知。合言葉の対象外（Stripe は、合言葉を持っていない）。POST だけを通す
    location = /stripe/webhook {
        auth_basic off;
        limit_except POST { deny all; }
        include /etc/nginx/snippets/press-release-proxy.conf;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        include /etc/nginx/snippets/press-release-proxy.conf;
        proxy_pass http://127.0.0.1:8000;
    }
}
