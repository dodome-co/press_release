# Nginx の設定（HTTPS・名前つきで公開するデモ用）。HTTP（nginx-press-release.conf）の代わりに使う。
# 置き場所：/etc/nginx/sites-available/press-release
#
# 前提：
#  - 名前は、IP アドレスから自動で引ける「34-85-70-93.sslip.io」（IP を変えたら、下の名前も変える）
#  - 証明書は、Let's Encrypt（certbot）で取る。取り方は、docs/VM設置手順.md の「HTTPS にする」
#  - ファイアウォールで、443 番を開ける（Google Cloud のコンソールで「HTTPS トラフィックを許可する」）
#
# なぜ HTTPS が要るか：ブラウザは、https:// のページでしか、マイク（音声入力）を使わせない。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # 証明書の取得・更新の確認（合言葉の対象外）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ほかは、HTTPS に移す
    location / {
        return 301 https://34-85-70-93.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 34-85-70-93.sslip.io;

    ssl_certificate /etc/letsencrypt/live/34-85-70-93.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34-85-70-93.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;                 # Nginx のバージョンを、出さない
    client_max_body_size 12m;          # 記事の納品ファイル（10MB）＋フォームの分
    client_body_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # 合言葉。ユーザー名とパスワードは、htpasswd で作る（手順書を参照）
    auth_basic "Demo (password required)";
    auth_basic_user_file /etc/nginx/press-release.htpasswd;

    # 隠しファイル（.git など）は、見せない
    location ~ /\.(?!well-known) { deny all; }

    # 見た目のファイル（CSS・ロゴ）は、Nginx から直接返す（速い）
    location /static/ {
        alias /opt/press-release/app/static/;
        expires 7d;
        access_log off;
    }

    # Stripe からの通知。合言葉の対象外（Stripe は、合言葉を持っていない）。POST だけを通す
    location = /stripe/webhook {
        auth_basic off;
        limit_except POST { deny all; }
        include /etc/nginx/snippets/press-release-proxy.conf;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        include /etc/nginx/snippets/press-release-proxy.conf;
        proxy_pass http://127.0.0.1:8000;
    }
}
