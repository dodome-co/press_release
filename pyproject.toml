[project]
name = "press-release"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.11.0",
    "cryptography>=50.0.2",
    "email-validator>=2.4.0",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "gunicorn>=27.0.1",
    "pillow>=13.0.0",
    "pymysql>=1.2.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
    "stripe>=17.0.0",
]

[dependency-groups]
dev = [
    "pypdf>=7.1.1",
    "pypdfium2>=5.15.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
