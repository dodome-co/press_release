[project]
name = "press-release"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docxtpl>=0.20.2",
    "email-validator>=2.4.0",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "gunicorn>=27.0.1",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "stripe>=17.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
